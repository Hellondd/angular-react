<h2>Список постов</h2>

@if (isLoading) {
  <p>Загрузка...</p>
}

@if (errorMessage) {
  <p style="color: red;">{{ errorMessage }}</p>
}

@for (post of posts; track post.id) {
  <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
    <h3>{{ post.title }}</h3>
    <p>{{ post.body }}</p>
  </div>
}
